apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otusapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /otusapp/avelpicasso(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: health-service
                port:
                  number: 8000

